<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SNAKISH is an accessibility-first neon grid Snake game."
    />
    <title>SNAKISH</title>

  <body>

      <header class="hero">
        <p class="eyebrow">Arcade systems online</p>
